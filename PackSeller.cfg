# PackSeller config (place next to PackSeller.dll). Format: key=value, '#' starts a comment.
# Reload in game: put the word "reload" into PackSeller.cmd (see docs/test-plan.md, stage 3).

# Distance of the test point from the animal start, in game units.
# What one unit is in metres is not verified yet: the log prints the measured speed.
test_distance=30

# Order timeout, seconds of accumulated game tick time (real-time hard cap is 5x).
timeout_seconds=60

# Arrival threshold in the XZ plane, game units.
arrival_radius=5

# "Probably stuck" must last this many seconds before the order is aborted.
stuck_seconds=5

# FSM update period / command file poll period / status line period, real milliseconds.
update_interval_ms=200
cmd_poll_ms=500
status_interval_ms=2000

# Verbose log (1/0). Stage 3 test: keep 1.
debug_log=1

# In-game messages (showPlayerAMessage) (1/0).
show_messages=1

# ---- Stage 3b probes (read-only, log only) ----
# Commands for PackSeller.cmd: traders | towns | prices | tradewin [on|off] (docs/test-plan.md, stage 3b).
# Radius around the selected animal / first player character for the "towns" command, game units.
probe_radius=20000

# Max budgeted lines per probe command (log size limiter). Summary lines are always written.
probe_max_lines=800

# "prices": max distance animal -> trader when no trade window is open, game units.
probe_trade_radius=1000

# ---- Stage 4: programmatic sell (commands "sell" and "sell dry" in PackSeller.cmd) ----
# Safety limiter: max number of item UNITS (sum of quantities) sold by one "sell" command.
sell_max_items=1

# 1 = "sell" only calculates and logs, changes NOTHING. Set 0 for a real sale (back up the save first!).
# The command "sell dry" never changes anything regardless of this value.
sell_dry_run=1

# Multiplier applied to getValueAll(true). 1.0 matched the game window in one calibration point (docs/api-notes.md).
sell_price_mult=1.0

# ---- Stage 5: trader list (command "list [distance|money|town]" in PackSeller.cmd, log only) ----
# Max distance from the animal to the trader's town centre (to the trader if he has no town), game units.
# Traders farther than the loaded world zone (about 2000 units from the squad was seen) do not exist as characters anyway.
list_radius=100000

# Hide traders with less money than this (used when list_hide_no_money=1).
list_min_money=100

# Sort order: distance | money (descending) | town (alphabet, then distance). The command argument overrides it.
list_sort=distance

# Filters (1/0).
list_hide_no_money=1
list_hide_nothing_to_sell=1
# 1 = only city traders (home town = current town, no wandering goal, town type TOWN/VILLAGE/OUTPOST, open to public).
list_only_city=1

# ---- Stage 6: UI (button "Traders" under OPEN BAG in the animal inventory window, trader window) ----
# 1 = install the inventory window hook and show the button. 0 = no hook at all (rest of the plugin works as before).
ui_enabled=1

# UI language: auto = Russian only when settings.cfg of the game has language=ru_RU (only then the game font has Cyrillic),
# otherwise English. en / ru force the language (ru without a ru_RU game shows empty squares instead of letters).
ui_language=auto

# 1 = MyGUI addWidgetModal for the trader window (blocks the other GUI while it is open; NOT confirmed in game yet).
# 0 = ordinary window (safe default): close with the Close button, the window cross or Esc.
ui_modal=0

# Manual button offset from the OpenBagButton corner, pixels (0/0 = automatic placement that avoids other widgets).
ui_button_x=0
ui_button_y=0

# ---- Stage 7: order cycle (Idle -> Going -> Selling -> Returning -> Idle) ----
# Command for PackSeller.cmd: "order <index>" (row of the trader list, 1 = first), "order <hand>" or "order status".
# 1 = the Sell button of the trader window starts the cycle (the animal walks to the trader, sells, walks back).
# 0 = the button only calculates (dry run), as in stage 6. The cycle sells for real only when sell_dry_run=0.
# With sell_dry_run=1 the whole cycle runs but the "sale" is only a calculation (safe test).
order_enabled=1

# "In the interaction zone": distance (XZ plane, game units) from the animal to the trader <= trade_range.
# The Going phase is also finished (and the sale starts) when the movement order ends / the path fails / the animal
# is stuck closer than trade_range * 1.5 (the animal cannot enter buildings, the order may end ~25 units short).
trade_range=150

# Returning: back when the order ended / stopped closer than this to the start point (game units).
# Arrival at the start is exact when closer than arrival_radius.
return_range=60

# How many times a stopped move order (ORDER_ENDED_FAR, STUCK) is re-sent per phase before the error exit.
retry_orders=4

# Timeout of ONE phase (Going, Returning), seconds of accumulated game tick time (hard cap: 5x in active real time).
# A speed of 15..75 units/s was measured (stage 3), list_radius=3000 -> up to ~200 s one way.
order_timeout_seconds=300

# Max item UNITS sold per cycle (replaces sell_max_items for the cycle).
order_max_items=200

# Trader INSIDE a building: the animal cannot enter, so it is sent to a point on a ring around the trader.
# approach_radius: ring radius, game units (0 = trade_range * 0.9). approach_candidates: points on the ring (4..32);
# all points are kept (no pathExists filter), tried nearest-to-the-animal first, the next one after each
# failed attempt (up to retry_orders attempts). None reachable: error exit NO_APPROACH.
approach_radius=0
approach_candidates=12

# 1 = also log pathExists() of the SELECTED approach point (one call per selection, only a diagnostic, never filters).
# Default 0: pathExists() for a ring point crashed the game process (stage 7 run 6); it also returned 1 for points inside buildings.
approach_check_path=0

# 1 = trader inside a building -> go to a ring point outside (approach_radius / approach_candidates). 0 = go to the trader position
# (as before the approach logic; for testing the rest of the cycle if the approach misbehaves).
approach_enabled=1

# ---- Stage 8: saving ----
# 1 = hooks FactionManager::saveGameState / GameWorld::loadAllPlatoons: an active order is written into the save and restored
# after loading (only if the animal and the trader exist). 0 = no hooks, the order is dropped on loading. Command: "save status".
save_enabled=1

# ---- Release review (QA) ----
# EN: 1 = the debug command file PackSeller.cmd is read (go, order, list, sell, save status, ...). The release config has 0:
#     the file is then ignored. The "Sell" button works independently of this key.
# RU: 1 = читается файл отладочных команд PackSeller.cmd (go, order, list, sell, save status, ...). В релизном конфиге 0:
#     файл игнорируется. Кнопка "Продать" работает независимо от этого ключа.
debug_commands=1

# EN: Trader of a hostile faction or town: block = the order is refused (message), warn = a warning is shown and the animal goes,
#     allow = no check. Default block (safe).
# RU: Торговец враждебной фракции или города: block = приказ отклоняется (сообщение), warn = предупреждение и животное идёт,
#     allow = без проверки. По умолчанию block (безопасно).
hostile_policy=block

# ---- 0.2 probe: debug commands "zone" and "gotown <row|name>" (need debug_commands=1) ----
# EN: gotown refuses a town farther than this from the animal, game units (hard maximum 20000).
# RU: gotown не начинает путь к городу дальше этого расстояния от животного, единицы игры (жёсткий максимум 20000).
probe_max_distance=6000

# EN: Timeout of ONE phase of the gotown walk (going, returning), seconds of ACTIVE (unpaused) real time.
# RU: Таймаут ОДНОЙ фазы пути gotown (туда, обратно), секунды АКТИВНОГО (без паузы) реального времени.
probe_timeout_seconds=600

# EN: 1 = after the probe the animal walks back to the start point.
# RU: 1 = после пробы животное возвращается на точку старта.
probe_return_home=1

# ================= 0.2 Other towns / Другие города =================

# EN: Traders farther than this from the animal get the "far" tag in the window; a trip to them shows a long-trip warning.
# RU: Торговцы дальше этого расстояния от животного помечаются в окне как "далеко"; при походе к ним выводится предупреждение о долгом пути.
list_far_distance=3000

# EN: Farther than this the row says "very far" and the start warning is stronger.
# RU: Дальше этого расстояния строка помечается "очень далеко", предупреждение при старте сильнее.
list_very_far_distance=10000

# EN: Traders farther than this are not listed and an order to them is refused. The loaded world is huge (tens of thousands of units).
# RU: Торговцы дальше этого расстояния не показываются, приказ к ним отклоняется. Загруженный мир огромен (десятки тысяч единиц).
max_trip_distance=40000

# EN: Assumed animal speed, units per ACTIVE real second at normal game speed. The phase timeout is
#     max(order_timeout_seconds, distance / this * order_timeout_factor).
# RU: Предполагаемая скорость животного, единиц за АКТИВНУЮ реальную секунду при обычной скорости игры. Таймаут фазы =
#     max(order_timeout_seconds, расстояние / это значение * order_timeout_factor).
order_speed_estimate=40
order_timeout_factor=2.5

# EN: After a SHORT "loading" flag without a loaded save the order waits this long for the animal/trader to resolve, then drops.
# RU: После КОРОТКОГО флага "загрузка" без загрузки сейва приказ ждёт столько секунд, пока животное/торговец найдутся, затем сбрасывается.
persist_resume_seconds=10

# Settings changed in the game (Options -> PackSeller tab: debug mode, language) are saved to PackSeller.user.cfg next to the DLL.
# That file is read AFTER this one and overrides debug_log and ui_language; this file is never rewritten. Delete the user file to return to these values.
